               values="0;1;1;0"
               keyTimes="0;0.05;0.92;1"
               dur="9.0s"
               begin="0.0s"
               repeatCount="indefinite" />
      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 7; 0 0; 0 0; 0 7"
                        keyTimes="0;0.05;0.92;1"
                        dur="9.0s"
                        begin="0.0s"
                        repeatCount="indefinite" />
      <text x="24" y="54" font-size="11.5" font-weight="700">
        <tspan fill="#39d353">YOUR_USERNAME</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#38bdf8">quantum-rig</tspan>
      </text>
