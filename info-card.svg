<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="info-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131b" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#121722" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="info-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a3c" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.35" />
    </linearGradient>

    <!-- Header Glass Line -->
    <linearGradient id="info-header-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9a3c" stop-opacity="0" />
      <stop offset="50%" stop-color="#ff9a3c" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Glow Filter for Color Swatches -->
    <filter id="swatch-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
  </style>

  <!-- Terminal Frame -->
  <rect x="1.5" y="1.5" width="437" height="397" rx="14" fill="url(#info-bg)" stroke="url(#info-border)" stroke-width="1.8" />

  <!-- macOS Window Chrome Header -->
  <rect x="2" y="2" width="436" height="32" rx="13" fill="#161b22" />
  <rect x="2" y="18" width="436" height="16" fill="#161b22" />
  <line x1="2" y1="34" x2="438" y2="34" stroke="#30363d" stroke-width="1" />
  <line x1="40" y1="34" x2="400" y2="34" stroke="url(#info-header-line)" stroke-width="1" />

  <!-- Traffic Lights -->
  <circle cx="18" cy="18" r="5.2" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="34" cy="18" r="5.2" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="50" cy="18" r="5.2" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Window Title -->
  <text x="220.0" y="22" fill="#8b949e" font-size="11" font-weight="600" text-anchor="middle" class="mono">
    sysinfo@cyberdeck:~ (neofetch)
  </text>

