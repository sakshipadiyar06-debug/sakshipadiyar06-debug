  <!-- Terminal Footer Divider -->
  <line x1="20" y1="276.2" x2="420" y2="276.2" stroke="#30363d" stroke-dasharray="4 4" stroke-width="1" />

  <!-- Typewriter Prompt Line 1: $ whoami -->
  <g class="mono" font-size="12">
    <!-- Prompt symbol -->
    <text x="24" y="302.2">
      <tspan fill="#38bdf8" font-weight="700">❯</tspan>
      <tspan fill="#a78bfa" font-weight="600"> ~</tspan>
      <tspan fill="#8b949e"> $ </tspan>
    </text>

    <!-- Typing "whoami" via reveal -->
    <g transform="translate(68, 0)">
      <text x="0" y="302.2" fill="#f0f6fc" font-weight="600">whoami</text>
      <!-- Cover rect that shrinks to reveal whoami -->
      <rect x="0" y="290.2" width="65" height="15" fill="#0d1117">
        <animate attributeName="width"
                 values="65;65;0;0;65"
                 keyTimes="0;0.186;0.197;0.92;1"
                 dur="9.0s"
                 repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Typewriter Result Line 2: » username [Role] -->
  <g class="mono" font-size="11.5">
    <g opacity="0">
      <text x="24" y="326.2">
        <tspan fill="#39d353" font-weight="700">»</tspan>
        <tspan fill="#00ff88" font-weight="700"> sakshipadiyar06-debug</tspan>
        <tspan fill="#8b949e"> [Full-Stack Architect &amp; AI Engineer]</tspan>
      </text>
      <animate attributeName="opacity"
               values="0;0;1;1;0"
               keyTimes="0;0.269;0.274;0.92;1"
               dur="9.0s"
               repeatCount="indefinite" />
    </g>

    <!-- Blinking Cursor at the end of the command -->
    <rect x="474" y="315.7" width="6.5" height="12.5" rx="1" fill="#00ff88" opacity="0">
      <animate attributeName="opacity"
               values="0;0;1;0;1;0;1;0"
