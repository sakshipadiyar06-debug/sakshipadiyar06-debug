  <!-- Scanning Cursor Block -->
  <rect width="7" height="9" rx="1" fill="#00ff88" filter="url(#cursor-glow)" opacity="0">
    <animate attributeName="opacity"
             values="0;0.9;0.9;0"
             keyTimes="0;0.02;0.1750;0.2250"
             dur="9.0s"
             repeatCount="indefinite" />
    <animate attributeName="x"
             values="24;324;24;324;24;324;24;324;24;324;24;324;24;324;24;324;24;324;24;324;24;324;24;324;24;324;24;324;24;324;24;324;24;324;24;324;24;324;24;324;24;324;324;324"
